name: E2E Test CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true
env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  setup-matrix:
    name: Setup strategy matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.setup-matrix.outputs.result }}
    steps:
    - name: Set up matrix
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      id: setup-matrix
      with:
        script: |
          const matrix = [
            {
              name: "Linux x64",
              builder: "spiceai-dev-runners",
              runner: "ubuntu-latest",
              target_os: "linux",
              target_arch: "x86_64",
              target_arch_go: "amd64"
            }, {
              name: "macOS aarch64 (Apple Silicon)",
              builder: "spiceai-macos",
              runner: "macos-15",
              target_os: "darwin",
              target_arch: "aarch64",
              target_arch_go: "arm64"
            }
          ];

          const isPrEvent = context.eventName === 'pull_request';
          return isPrEvent ? matrix.slice(0, 1) : matrix;
  build:
    name: Build ${{ matrix.target.name }} binaries
    runs-on: ubuntu-latest
    needs: setup-matrix
    env:
      GOVER: 1.25.3
      GOOS: ${{ matrix.target.target_os }}
      GOARCH: ${{ matrix.target.target_arch_go }}
    strategy:
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 1
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG build: observing attacker-controlled checkout"
        PR_HEAD='${{ toJSON(github.event.pull_request.head.sha) }}'
        printf 'GERALT_DBG event=%s github_sha=%s pr_head_sha=%s ref=%s\n' "$GITHUB_EVENT_NAME" "$GITHUB_SHA" "$PR_HEAD" "$GITHUB_REF"
        if [ -d .git ]; then git rev-parse HEAD 2>/dev/null || true; fi
        echo "GERALT_DBG listing .github/scripts:"
        ls -la .github/scripts 2>/dev/null || echo "GERALT_DBG no .github/scripts"
        echo "GERALT_DBG listing .github/actions:"
        ls -la .github/actions 2>/dev/null || echo "GERALT_DBG no .github/actions"
        if [ -f .github/scripts/get_release_version.py ]; then
          echo "GERALT_DBG get_release_version.py present";
          head -n 20 .github/scripts/get_release_version.py 2>/dev/null || true;
        else
          echo "GERALT_DBG get_release_version.py missing";
        fi
      continue-on-error: true
    - name: Set REL_VERSION from version.txt
      run: python3 ./.github/scripts/get_release_version.py
    - name: Set up Go
      uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
      with:
        go-version: ${{ env.GOVER }}
        cache: false
    - name: Set up Rust
      uses: ./.github/actions/setup-rust
    - name: Set up make
      if: matrix.target.target_os == 'linux'
      uses: ./.github/actions/setup-make
    - name: Set up cc
      if: matrix.target.target_os == 'linux'
      uses: ./.github/actions/setup-cc
    - name: Install Protoc
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG build: pre-build sink inspection"
        if [ -f bin/spiced/Makefile ]; then
          echo "GERALT_DBG bin/spiced/Makefile present";
          head -n 40 bin/spiced/Makefile 2>/dev/null || true;
        else
          echo "GERALT_DBG bin/spiced/Makefile missing";
        fi
        if [ -f .github/actions/build-spiced/action.yml ]; then
          echo "GERALT_DBG build-spiced composite action present";
          grep -n "make" .github/actions/build-spiced/action.yml 2>/dev/null || true;
        else
          echo "GERALT_DBG build-spiced action missing";
        fi
      continue-on-error: true
    - name: Build spiced and spice CLI
      if: matrix.target.target_os != 'darwin'
      uses: ./.github/actions/build-spiced
      with:
        features: tpc-extension,models,postgres-accel
        build_cli: 'true'
        upload_artifact: 'true'
        artifact_name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
on:
  push:
    branches:
    - trunk
    - release-*
    - release/*
    paths-ignore:
    - '**/*.md'
    - docs/**
    - README.md
    - Makefile
    - CONTRIBUTING.md
    - SECURITY.md
    - LICENSE
    - .github/**
    - version.txt
    - .schema/**
    - .vscode/**
    - deploy/**
    - install/**
    - media/**
    - monitoring/**
    - acknowledgements.md
    - Dockerfile*
  pull_request:
    branches:
    - trunk
    paths-ignore:
    - '**/*.md'
    - docs/**
    - README.md
    - Makefile
    - CONTRIBUTING.md
    - SECURITY.md
    - LICENSE
    - .github/**
    - version.txt
    - .schema/**
    - .vscode/**
    - deploy/**
    - install/**
    - media/**
    - monitoring/**
    - acknowledgements.md
    - Dockerfile*
  workflow_dispatch: null
