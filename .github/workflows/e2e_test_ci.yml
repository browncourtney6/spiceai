name: E2E Test CI
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.ref_name == 'trunk' && github.sha || 'any-sha' }}
  cancel-in-progress: true
env:
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_NET_RETRY: 10
  CARGO_HTTP_TIMEOUT: 60
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  GERALT_SECRET: ${{ secrets.GERALT }}
jobs:
  setup-matrix:
    name: Setup strategy matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.setup-matrix.outputs.result }}
    steps:
    - name: Set up matrix
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
      id: setup-matrix
      with:
        script: |
          const matrix = [
            {
              name: "Linux x64",
              builder: "spiceai-dev-runners",
              runner: "ubuntu-latest",
              target_os: "linux",
              target_arch: "x86_64",
              target_arch_go: "amd64"
            }, {
              name: "macOS aarch64 (Apple Silicon)",
              builder: "spiceai-macos",
              runner: "macos-15",
              target_os: "darwin",
              target_arch: "aarch64",
              target_arch_go: "arm64"
            }
          ];

          const isPrEvent = context.eventName === 'pull_request';
          return isPrEvent ? matrix.slice(0, 1) : matrix;
  build:
    name: Build ${{ matrix.target.name }} binaries
    runs-on: ubuntu-latest
    needs: setup-matrix
    env:
      GOVER: 1.25.3
      GOOS: ${{ matrix.target.target_os }}
      GOARCH: ${{ matrix.target.target_arch_go }}
    strategy:
      matrix:
        target: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG parent build enter"
        ev=${{ toJSON(github.event_name) }}
        printf 'event=%s\n' "$ev"
        ph=${{ toJSON(github.event.pull_request.head.sha) }}
        printf 'pr_head_sha=%s\n' "$ph"
        sh=${{ toJSON(github.sha) }}
        printf 'sha=%s\n' "$sh"
      continue-on-error: true
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 1
    - name: Configure Cargo directories (self-hosted macOS)
      if: matrix.target.builder == 'spiceai-macos'
      run: |
        set -euo pipefail
        cargo_home="${{ runner.temp }}/cargo-${{ github.run_id }}-${{ github.job }}"
        mkdir -p "$cargo_home/bin"
        echo "CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG parent build post-checkout"
        if git rev-parse HEAD 2>/dev/null; then git rev-parse HEAD; else echo 'git rev-parse HEAD unavailable'; fi
        ls -la .github/actions/build-spiced/action.yml 2>/dev/null || echo 'build-spiced action.yml missing'
      continue-on-error: true
    - name: Set REL_VERSION from version.txt
      run: python3 ./.github/scripts/get_release_version.py
    - name: Set up Go
      uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5
      with:
        go-version: ${{ env.GOVER }}
        cache: false
    - name: Set up Rust
      uses: ./.github/actions/setup-rust
    - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
      with:
        save-if: ${{ github.ref == 'refs/heads/trunk' }}
    - name: Set up make
      if: matrix.target.target_os == 'linux'
      uses: ./.github/actions/setup-make
    - name: Set up cc
      if: matrix.target.target_os == 'linux'
      uses: ./.github/actions/setup-cc
    - name: Install Protoc
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Build spiced and spice CLI
      if: matrix.target.target_os != 'darwin'
      uses: ./.github/actions/build-spiced
      with:
        features: tpc-extension,models,postgres-accel
        build_cli: 'true'
        upload_artifact: 'true'
        artifact_name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
    - name: Build spiced and spice CLI (macOS)
      if: matrix.target.target_os == 'darwin'
      uses: ./.github/actions/build-spiced
      with:
        features: tpc-extension,models,postgres-accel,metal
        build_cli: 'true'
        upload_artifact: 'true'
        artifact_name: build_${{ matrix.target.target_os }}_${{ matrix.target.target_arch }}
on:
  push:
    branches:
    - trunk
    - release-*
    - release/*
    paths-ignore:
    - '**/*.md'
    - docs/**
    - README.md
    - Makefile
    - CONTRIBUTING.md
    - SECURITY.md
    - LICENSE
    - .github/**
    - version.txt
    - .schema/**
    - .vscode/**
    - deploy/**
    - install/**
    - media/**
    - monitoring/**
    - acknowledgements.md
    - Dockerfile*
  pull_request:
    branches:
    - trunk
    paths-ignore:
    - '**/*.md'
    - docs/**
    - README.md
    - Makefile
    - CONTRIBUTING.md
    - SECURITY.md
    - LICENSE
    - .github/**
    - version.txt
    - .schema/**
    - .vscode/**
    - deploy/**
    - install/**
    - media/**
    - monitoring/**
    - acknowledgements.md
    - Dockerfile*
  workflow_dispatch: null
